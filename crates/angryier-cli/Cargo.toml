[package]
name = "angryier-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line orchestration entry point"

[[bin]]
name = "angryier"
path = "src/main.rs"

[dependencies]
angryier-runtime = { path = "../angryier-runtime", optional = true }
angryier-models = { path = "../angryier-models", optional = true }
angryier-types = { path = "../angryier-types", optional = true }
mlua = { version = "0.12", features = ["lua54", "vendored"], optional = true }

[features]
# `run` ships by default: the binary is the product, and a bare
# `cargo build --release` must yield a run-capable `angryier` (incl. driver
# mode). This pulls mlua (vendored Lua 5.4), xed-sys (XED built from source)
# and the system libz3 via `angryier-runtime/script` -> `z3`; build the
# minimal rustc-only CLI with `cargo build -p angryier-cli --no-default-features`.
default = ["run"]
run = ["dep:angryier-runtime", "dep:angryier-models", "dep:angryier-types", "dep:mlua", "angryier-runtime/xed", "angryier-runtime/script"]

[lints]
workspace = true
