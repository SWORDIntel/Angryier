[package]
name = "angryier-campaign"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host-native loopback sustained campaign coordinator and worker"

[dependencies]
angryier-distribution = { path = "../angryier-distribution" }
angryier-types = { path = "../angryier-types" }
angryier-expr = { path = "../angryier-expr" }
angryier-ledger = { path = "../angryier-ledger" }
angryier-loader = { path = "../angryier-loader" }
angryier-runtime = { path = "../angryier-runtime" }
sha2 = "0.10"
chacha20poly1305 = "=0.10.1"
getrandom = "=0.2.17"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
angryier-runtime = { path = "../angryier-runtime", features = ["xed", "z3"] }
angryier-arch-intel64 = { path = "../angryier-arch-intel64" }
angryier-ir = { path = "../angryier-ir" }
angryier-solver-z3 = { path = "../angryier-solver-z3", features = ["ffi"] }

[features]
default = []

[lints]
workspace = true
