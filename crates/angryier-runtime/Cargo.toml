[package]
name = "angryier-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pipeline glue wiring loader, decoder, semantics, IR, interpreter, and SimProcedures for end-to-end execution"

[dependencies]
angryier-arch = { path = "../angryier-arch" }
angryier-arch-intel64 = { path = "../angryier-arch-intel64" }
angryier-cfg = { path = "../angryier-cfg" }
angryier-execution = { path = "../angryier-execution" }
angryier-expr = { path = "../angryier-expr" }
angryier-ir = { path = "../angryier-ir" }
angryier-loader = { path = "../angryier-loader" }
angryier-memory = { path = "../angryier-memory" }
angryier-models = { path = "../angryier-models" }
angryier-provenance = { path = "../angryier-provenance" }
angryier-semantics = { path = "../angryier-semantics" }
angryier-scheduler = { path = "../angryier-scheduler" }
angryier-semantics-intel64 = { path = "../angryier-semantics-intel64" }
angryier-semantics-gen = { path = "../angryier-semantics-gen" }
angryier-solver = { path = "../angryier-solver" }
angryier-state = { path = "../angryier-state" }
angryier-types = { path = "../angryier-types" }
mlua = { version = "0.12", features = ["lua54", "vendored"], optional = true }
angryier-arch-xed-ffi = { path = "../angryier-arch-xed-ffi", optional = true }
angryier-solver-z3 = { path = "../angryier-solver-z3", optional = true }

[features]
default = []
# Native Intel XED decoding plus the XED instruction-class form mapping.
xed = ["dep:angryier-arch-xed-ffi"]
# Native Z3 solver backend (links the system libz3) for branch solving.
z3 = ["dep:angryier-solver-z3", "angryier-solver-z3/ffi"]
# Embedded Lua scripting — user hooks and exploration predicates without
# recompiling (Phase 15).
script = ["dep:mlua", "z3"]

[dev-dependencies]
angryier-solver-fuzzy = { path = "../angryier-solver-fuzzy" }

[lints]
workspace = true
