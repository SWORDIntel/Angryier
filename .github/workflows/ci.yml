name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show
      - name: Check CLI run frontend
        run: cargo check -p angryier-cli --all-targets
      - name: Test branch analysis regressions
        run: cargo test -p angryier-runtime --features "xed script" --test lua_api test_angry_run_branch_analysis_
      - name: Test CFG target distance
        run: cargo test -p angryier-cfg shortest_static_distance_is_bounded_and_block_aware
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Test (native XED pipeline)
        run: cargo test -p angryier-runtime --features xed
