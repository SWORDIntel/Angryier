name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup show
      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - name: Check CLI run frontend
        run: cargo check -p angryier-cli --all-targets
      - name: Test branch analysis regressions
        run: cargo test -p angryier-runtime --features "xed script" --test lua_api test_angry_run_branch_analysis_
      - name: Test branch steering policy
        run: cargo test -p angryier-runtime --features "xed script" branch_steering_
      - name: Test fail-closed solver path constraints
        run: cargo test -p angryier-runtime --features "xed script" solver_path_conversion_
      - name: Test replay restart safety
        run: cargo test -p angryier-runtime --features "xed script" reset_to_entry_rewinds_mutable_environment_cursors
      - name: Test CFG target distance
        run: cargo test -p angryier-cfg shortest_static_distance_is_bounded_and_block_aware
      - name: Format
        run: cargo fmt --all -- --check
      - name: Native workspace dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libgmp-dev
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Test (native XED pipeline)
        run: cargo test -p angryier-runtime --features xed
