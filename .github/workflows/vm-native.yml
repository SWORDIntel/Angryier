name: Native VM analysis validation

on:
  push:
    branches:
      - feat/themida-vm-structural-20261015
  pull_request:
    paths:
      - 'crates/angryier-cfg/**'
      - 'crates/angryier-expr/**'
      - 'crates/angryier-ir/**'
      - 'crates/angryier-loader/**'
      - 'crates/angryier-models/**'
      - 'crates/angryier-cli/**'
      - 'crates/angryier-runtime/**'
      - '.github/workflows/vm-native.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vm-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Check VM crates
        run: cargo check -p angryier-cfg -p angryier-expr -p angryier-ir -p angryier-loader -p angryier-models -p angryier-runtime -p angryier-cli --all-targets
      - name: VM CFG tests
        run: cargo test -p angryier-cfg
      - name: VM expression tests
        run: cargo test -p angryier-expr
      - name: Symbolic/Concolic execution regression suite
        run: cargo test -p angryier-execution
      - name: AngryIR effect and trace regression suite
        run: cargo test -p angryier-ir
      - name: VM loader tests
        run: cargo test -p angryier-loader
      - name: Win32 API and synchronization tests
        run: cargo test -p angryier-models
      - name: Native runtime unit and fidelity tests
        run: cargo test -p angryier-runtime --features "xed script" --lib
      - name: VM runtime integration tests
        run: cargo test -p angryier-runtime --features "xed script" --test lua_api
      - name: Windows PE call-return fidelity regressions
        run: cargo test -p angryier-runtime --features "xed script" --test pe_driver
      - name: VM handler SSA materialization integration
        run: cargo test -p angryier-runtime --features "xed script" --test vm_materialization
      - name: CLI forensic command tests
        run: cargo test -p angryier-cli
      # Existing main has unrelated clippy warnings. Retain diagnostic output
      # instead of hiding the compile/test result behind that baseline debt.
      - name: Clippy analysis (baseline warnings reported)
        run: cargo clippy -p angryier-cfg -p angryier-expr -p angryier-ir -p angryier-loader -p angryier-models -p angryier-runtime --lib
      - name: Clippy forensic CLI
        run: cargo clippy -p angryier-cli --bin angryier
